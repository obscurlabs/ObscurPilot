<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ObscurPilot intro</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/words.js"></script>
    <script src="assets/vo-rms.js"></script>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('assets/fonts/inter-var.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('assets/fonts/jetbrains-mono-var.woff2') format('woff2');
        font-weight: 100 800;
      }
      :root {
        --bg: #0b0d12;
        --text: #eef1f7;
        --muted: #9aa3b4;
        --pilot: #8b7cff;
        --teal: #2dd4bf;
        --live: #ff4d5e;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .bg video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #bg-mic {
        transform-origin: 50% 45%;
      }
      #bg-prompt {
        filter: blur(7px) saturate(0.8);
        transform: scale(1.06);
      }
      #shade-1 {
        background: linear-gradient(180deg, rgba(11, 13, 18, 0.15) 0%, rgba(11, 13, 18, 0.25) 50%, rgba(11, 13, 18, 0.9) 100%);
      }
      #shade-2 {
        background: radial-gradient(ellipse at 50% 45%, rgba(11, 13, 18, 0.62), rgba(11, 13, 18, 0.88));
      }

      /* Opener */
      #opener {
        position: absolute;
        left: 160px;
        right: 160px;
        bottom: 120px;
        margin: 0;
        text-align: center;
        font-size: 66px;
        font-weight: 680;
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
      }
      #opener .w {
        display: inline-block;
        margin-right: 0.24em;
      }

      /* Voice prompt card */
      #card {
        position: absolute;
        left: 260px;
        top: 150px;
        width: 1400px;
        height: 760px;
        box-sizing: border-box;
        padding: 40px 56px 0;
        border: 1px solid rgba(160, 175, 205, 0.2);
        border-radius: 30px;
        background: rgba(14, 17, 25, 0.82);
        box-shadow: 0 40px 140px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      #card-head {
        display: flex;
        align-items: center;
        gap: 22px;
        padding-bottom: 28px;
        border-bottom: 1px solid rgba(160, 175, 205, 0.14);
      }
      #mic {
        position: relative;
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(139, 124, 255, 0.18);
      }
      #mic-halo {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px solid rgba(139, 124, 255, 0.55);
        opacity: 0.3;
      }
      #card-head h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: var(--pilot);
      }
      #card-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 22px;
      }
      #rec {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 26px;
        color: var(--muted);
      }
      #rec-dot {
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--live);
      }
      #viewport {
        position: relative;
        height: 560px;
        margin-top: 30px;
        overflow: hidden;
      }
      #words {
        margin: 0;
        font-size: 50px;
        font-weight: 600;
        line-height: 1.42;
        letter-spacing: -0.012em;
      }
      #words .w {
        display: inline-block;
        margin-right: 0.26em;
        opacity: 0.16;
      }
      #words .hl {
        color: #b3a8ff;
      }

      /* Turn */
      #turn {
        position: absolute;
        left: 0;
        right: 0;
        top: 440px;
        margin: 0;
        text-align: center;
        font-size: 110px;
        font-weight: 760;
        letter-spacing: -0.035em;
      }
      #turn span {
        color: var(--pilot);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-width="1920" data-height="1080" data-duration="59.5">
      <!-- Opener: microphone, "without typing a single line of code" -->
      <div id="bg-mic" class="layer bg">
        <video id="v-mic" src="assets/stock/mic.mp4" data-start="0" data-duration="5.93" data-track-index="0" muted playsinline></video>
      </div>
      <section id="s-open" class="layer clip" data-start="0" data-duration="5.93" data-track-index="1">
        <div id="shade-1" class="layer"></div>
        <p id="opener"></p>
      </section>

      <!-- The voice prompt over the build -->
      <div id="bg-prompt" class="layer bg">
        <video id="v-code" src="assets/stock/code.mp4" data-start="5.93" data-duration="25.88" data-track-index="0" muted playsinline></video>
        <video id="v-dash" src="assets/stock/dash.mp4" data-start="31.81" data-duration="16.24" data-track-index="0" muted playsinline></video>
        <video id="v-code2" src="assets/stock/code.mp4" data-start="48.05" data-duration="11.45" data-media-start="12" data-track-index="0" muted playsinline></video>
      </div>
      <section id="s-prompt" class="layer clip" data-start="5.93" data-duration="51.1" data-track-index="1">
        <div id="shade-2" class="layer"></div>
        <div id="card">
          <div id="card-head">
            <span id="mic">
              <span id="mic-halo"></span>
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b3a8ff" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" />
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
              </svg>
            </span>
            <div>
              <h2>VOICE PROMPT</h2>
              <p>Spoken, not typed</p>
            </div>
            <span id="rec"><span id="rec-dot"></span><span id="rec-time">00:00</span></span>
          </div>
          <div id="viewport" data-layout-allow-overflow><p id="words" data-layout-allow-overflow data-layout-allow-occlusion></p></div>
        </div>
      </section>

      <!-- Turn to the product -->
      <section id="s-turn" class="layer clip" data-start="57.03" data-duration="2.47" data-track-index="1">
        <p id="turn">So I built <span>it.</span></p>
      </section>

      <!-- Audio -->
      <audio id="vo-opener" src="assets/audio/opener.wav" data-start="0.5" data-duration="5.29" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-prompt" src="assets/audio/prompt.wav" data-start="6.6" data-duration="49.0" data-track-index="4" data-volume="1"></audio>
    </div>

    <script>
      const OPENER_AT = 0.5;
      const PROMPT_AT = 6.6;
      const HIGHLIGHT = /^(ObscurPilot|Electron|React|TypeScript|Alt|X|Wispr|Flow|OBS|Pilot|LED|dot-matrix|API|keys)$/;

      const build = () => {
        const tl = gsap.timeline({ paused: true });
        const ease = 'power3.out';

        // Opener words, each revealed as it is spoken
        const opener = document.getElementById('opener');
        for (const { w, t } of window.WORDS.opener) {
          const span = document.createElement('span');
          span.className = 'w';
          span.textContent = w;
          opener.appendChild(span);
          tl.fromTo(span, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.2, ease }, OPENER_AT + t);
        }
        tl.fromTo('#bg-mic', { scale: 1.0 }, { scale: 1.12, duration: 5.93, ease: 'none' }, 0);
        tl.to('#opener', { opacity: 0, duration: 0.3 }, 5.6);

        // Prompt card
        tl.fromTo('#card', { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease }, 6.0);
        const words = document.getElementById('words');
        const spans = window.WORDS.prompt.map(({ w }) => {
          const span = document.createElement('span');
          span.className = 'w' + (HIGHLIGHT.test(w.replace(/[^A-Za-z-]/g, '')) ? ' hl' : '');
          span.textContent = w;
          // Words scroll through a clipped window; hidden lines are intentional.
          span.setAttribute('data-layout-allow-occlusion', '');
          span.setAttribute('data-layout-allow-overflow', '');
          words.appendChild(span);
          return span;
        });

        // Line positions are measured once from the settled layout, then scrolled in time
        const lineHeight = parseFloat(getComputedStyle(words).lineHeight);
        const visibleLines = Math.floor(560 / lineHeight);
        let scrolledTo = 0;
        spans.forEach((span, i) => {
          const at = PROMPT_AT + window.WORDS.prompt[i].t;
          tl.fromTo(span, { opacity: 0.16 }, { opacity: 1, duration: 0.18, ease: 'none' }, at);
          const line = Math.round(span.offsetTop / lineHeight);
          const target = Math.max(0, line - (visibleLines - 1));
          if (target > scrolledTo) {
            tl.to(words, { y: -target * lineHeight, duration: 0.35, ease: 'power2.out' }, at - 0.05);
            scrolledTo = target;
          }
        });
        tl.to('#card', { opacity: 0, scale: 0.98, duration: 0.4 }, 56.6);

        // Turn
        tl.fromTo('#turn', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease }, 57.15);

        // Voice-reactive mic halo and recording clock
        const halo = document.getElementById('mic-halo');
        const clock = document.getElementById('rec-time');
        const voFrames = window.VO.prompt;
        for (let f = 0; f < voFrames.length; f++) {
          const level = voFrames[f];
          const seconds = Math.floor(f / window.VO.fps);
          tl.call(() => {
            halo.style.opacity = (0.25 + 0.7 * level).toFixed(3);
            halo.style.transform = `scale(${(1 + 0.18 * level).toFixed(3)})`;
            clock.textContent = `00:${String(seconds).padStart(2, '0')}`;
          }, [], PROMPT_AT + f / window.VO.fps);
        }

        window.__timelines['intro'] = tl;
      };

      document.fonts.ready.then(build);
    </script>
  </body>
</html>
